<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">StrokeGPT-ReVibed</title>
  <desc id="desc">StrokeGPT-ReVibed wordmark with a motion trace emblem.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171c"/>
      <stop offset="1" stop-color="#0e0f12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb7a3"/>
      <stop offset="0.55" stop-color="#a99aef"/>
      <stop offset="1" stop-color="#d58ba6"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="360" rx="38" fill="url(#panel)"/>
  <rect x="28" y="28" width="904" height="304" rx="30" fill="none" stroke="#2d333d" stroke-width="3"/>
  <g transform="translate(90 82)" filter="url(#soft-glow)">
    <rect x="0" y="0" width="104" height="196" rx="52" fill="#101217" stroke="#37404c" stroke-width="4"/>
    <rect x="24" y="34" width="56" height="128" rx="28" fill="#7fb7a3" opacity="0.22" stroke="#7fb7a3" stroke-width="3"/>
    <rect x="43" y="60" width="18" height="60" rx="9" fill="#66707f"/>
    <path d="M23 134 C39 110 65 112 81 86" fill="none" stroke="url(#accent)" stroke-width="13" stroke-linecap="round"/>
    <circle cx="52" cy="134" r="10" fill="#e8e6df"/>
  </g>
  <g transform="translate(238 118)">
    <text x="0" y="62" fill="#e8e6df" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="0">StrokeGPT</text>
    <text x="4" y="132" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="0">ReVibed</text>
    <path d="M8 162 H160 C184 162 192 130 214 130 C238 130 244 186 270 186 C294 186 304 162 326 162 H656" transform="translate(28 0)" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
