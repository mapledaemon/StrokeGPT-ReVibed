name: Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        # Node 20+ provides the stable stdlib `node:test` runner that
        # tests/test_frontend_runtime.py invokes for behavioral frontend
        # tests. The wrapper also skips cleanly when `node` is missing,
        # so omitting this step keeps the suite green; we install Node
        # here so CI actually exercises tests/js/*.test.mjs.
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Flask requests elevenlabs

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Compile-check Python
        run: python -m py_compile app.py strokegpt/*.py tests/*.py
